<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Смотрим вместе</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
body{margin:0;padding:12px;font-family:sans-serif;background:var(--tg-theme-bg-color,#fff);color:var(--tg-theme-text-color,#000)}
#player{width:100%;aspect-ratio:16/9;background:#000}
input{width:100%;box-sizing:border-box;padding:10px;margin:10px 0;font-size:16px}
button{width:100%;padding:12px;font-size:16px}
</style>
</head>
<body>
<h3>Смотрим вместе</h3>
<div id="player"></div>
<input id="link" placeholder="Вставь ссылку на YouTube">
<button onclick="loadVideo()">Загрузить видео</button>

<script src="https://www.youtube.com/iframe_api"></script>
<script>
Telegram.WebApp.ready();
Telegram.WebApp.expand();

let player;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('player', { width: '100%', height: '100%' });
}

function loadVideo() {
  const url = document.getElementById('link').value;
  const m = url.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  if (!m) { alert('Не удалось распознать ссылку'); return; }
  player.loadVideoById(m[1]);
}
</script>
</body>
</html>
